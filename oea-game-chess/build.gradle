// Chess — rules, AI levels, pass & play and multiplayer.
//
// A complete, separately installable OEA game. It is one activity
// ([com.oea.games.OeaStandaloneGameActivity] with a fixed game id) on top of
// the shared engine and games library, and it owns its own front screen,
// settings and multiplayer — the launcher is never involved.
android {
    namespace "com.oea.standalone.chess"
    compileSdk 36
    defaultConfig {
        applicationId "com.oea.chess"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        // WebRTC ships native code; shipping every ABI would double or triple
        // the APK for architectures no phone runs.
        ndk { abiFilters.addAll(["arm64-v8a", "armeabi-v7a"]) }
    }
    buildTypes {
        release {
            // The game library carries all four first-party games; R8 keeps
            // the code this app actually reaches and drops the rest.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), rootProject.file("gradle/proguard-game.pro")
            // Signed with the debug key, like the launcher. Without this the
            // release APK is unsigned, so Android refuses to install it — the
            // game builds, gets published, and cannot be opened.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        // Compress the native libraries in the APK (Android extracts them on
        // install). WebRTC is the largest thing in a game app by far.
        jniLibs { useLegacyPackaging = true }
        resources {
            excludes += [
                "/META-INF/{AL2.0,LGPL2.1}",
                "/META-INF/*.kotlin_module",
                "/META-INF/*.version",
                "/META-INF/DEPENDENCIES",
                "/META-INF/NOTICE",
                "/META-INF/NOTICE.txt",
                "/META-INF/LICENSE",
                "/META-INF/LICENSE.txt",
                "DebugProbesKt.bin",
                "kotlin-tooling-metadata.json",
            ]
        }
    }
}

kotlin { jvmToolchain(21) }

dependencies {
    implementation project(":oea-games")
}
