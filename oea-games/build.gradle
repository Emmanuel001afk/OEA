plugins {
    alias(libs.plugins.android.library)
}

// First-party OEA games (Endless Days, Send Off, Chess and the Engine Lab).
// Their stable internal ids remain runner and arena for save/network compatibility. They are
// written only against the engine's public API, exactly like new games should be.
android {
    namespace "com.oea.games"
    compileSdk 36
    defaultConfig {
        minSdk 26
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
kotlin { jvmToolchain(21) }

dependencies {
    api project(":oea-engine")
    testImplementation libs.junit
}
