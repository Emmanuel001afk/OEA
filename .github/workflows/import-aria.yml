name: Import ARIA Launcher base
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  import-aria:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch aria-dev https://github.com/trek-boldly-go/aria-launcher.git /tmp/aria
      - run: rsync -a --exclude=.git --exclude=.github /tmp/aria/ ./
      - run: touch .oea-aria-imported && printf '%s\n' '# OEA' 'OEA launcher based on ARIA Launcher aria-dev.' > OEA_BASE.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import ARIA Launcher base into OEA'
          git push origin HEAD:main
