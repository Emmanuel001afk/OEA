name: Package ARIA Launcher base
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package-aria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone ARIA
        run: git clone --depth 1 --branch aria-dev https://github.com/trek-boldly-go/aria-launcher.git /tmp/aria
      - name: Package source
        run: tar -C /tmp/aria --exclude=.git -czf /tmp/aria-launcher-aria-dev.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: aria-launcher-aria-dev
          path: /tmp/aria-launcher-aria-dev.tar.gz
          retention-days: 1
