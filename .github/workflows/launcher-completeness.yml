name: Launcher Completeness Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completeness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OEA
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify launcher component contract
        run: python3 tools/launcher-completeness-check.py

      - name: Verify complete launcher feature suites
        run: python3 tools/launcher-feature-suite.py

      - name: Refresh recursive submodules
        run: |
          git submodule update --init --recursive || true
          if [ ! -d platform_frameworks_libs_systemui/viewcapturelib ]; then
            rm -rf platform_frameworks_libs_systemui
            git clone --depth 1 --branch 16-dev https://github.com/LawnchairLauncher/platform_frameworks_libs_systemui platform_frameworks_libs_systemui
          fi

      - name: Verify Gradle wrapper
        run: test -x ./gradlew || chmod +x ./gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build launcher as an integration smoke test
        run: ./gradlew assembleLawnWithQuickstepGithubRelease --stacktrace
