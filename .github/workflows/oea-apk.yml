name: OEA Launcher APK

permissions:
  contents: write

# Serialize release publication: rapid pushes must not concurrently delete/upload
# the same OEA-latest.apk asset, which can produce uploads.github.com 404s.
concurrency:
  group: oea-apk-release
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OEA
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Verify App Freezer integration
        run: |
          set -euo pipefail
          FREEZER=oea/src/main/java/com/oea/launcher/applock/OeaAppFreezer.kt
          TOOLS=oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          MANIFEST=oea/src/main/AndroidManifest.xml
          grep -Fq "setPackagesSuspended" "$FREEZER"
          grep -Fq "isPackageSuspended" "$FREEZER"
          grep -Fq "rootSuspensionState(packageName)" "$FREEZER"
          grep -Fq "Android did not confirm the requested frozen state" "$FREEZER"
          grep -Fq "dumpsys package" "$FREEZER"
          grep -Fq "fun hibernatedPackages" "$FREEZER"
          grep -Fq "android.intent.category.HOME" "$MANIFEST"
          grep -Fq "android.intent.category.DEFAULT" "$MANIFEST"
          grep -Fq "QUERY_ALL_PACKAGES" "$MANIFEST"
          grep -Fq "SELECT VISIBLE" "$TOOLS"
          grep -Fq "REFRESH STATE" "$TOOLS"
          grep -Fq "freezerOperationRunning" "$TOOLS"
          grep -Fq "loadInstalledFreezerApps" "$TOOLS"
          ! grep -Fq "adb shell dpm set-device-owner" "$TOOLS"
          ! grep -Fq "Copy Device Owner command" "$TOOLS"
          ! grep -Fq "DEVICE OWNER SETUP" "$TOOLS"
      - name: Verify launcher identity and required launcher features
        run: |
          set -euo pipefail
          SRC=oea/src/main/java/com/oea/launcher
          MANIFEST=oea/src/main/AndroidManifest.xml
          WS=$SRC/workspace/OeaWorkspace.kt
          # Home role, wallpaper window and own-app identities.
          grep -Fq 'android:excludeFromRecents="true"' "$MANIFEST"
          grep -Fq 'android:theme="@style/OeaHomeTheme"' "$MANIFEST"
          grep -Fq 'android:windowShowWallpaper' oea/src/main/res/values/styles.xml
          grep -Fq 'android.content.pm.action.CONFIRM_PIN_SHORTCUT' "$MANIFEST"
          grep -Fq 'android.content.pm.action.CONFIRM_PIN_APPWIDGET' "$MANIFEST"
          grep -Fq 'com.oea.launcher.gameboost.OeaGameBoostActivity' "$MANIFEST"
          grep -Fq 'android:label="Game Boost"' "$MANIFEST"
          grep -Fq '@drawable/ic_oea_game_boost' "$MANIFEST"
          grep -Fq 'android:label="OEA Settings"' "$MANIFEST"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -Fq 'android.permission.SET_WALLPAPER' "$MANIFEST"
          grep -Fq 'android.permission.REQUEST_DELETE_PACKAGES' "$MANIFEST"
          test "$(grep -c 'android.intent.category.LAUNCHER' "$MANIFEST")" -ge 6
          # OEA Home: launching, gestures, drag and drop, widgets, pairs.
          grep -Fq 'fun onHomeIntent(alreadyOnHome: Boolean)' "$WS"
          grep -Fq 'startMainActivity' "$WS"
          grep -Fq 'makeClipRevealAnimation' "$WS"
          grep -Fq 'requestDisallowInterceptTouchEvent(false)' "$WS"
          grep -Fq 'DecelerateInterpolator' "$WS"
          grep -Fq 'private fun widgetRowsOnPage' "$WS"
          grep -Fq 'fun addPinnedWidget' "$WS"
          grep -Fq 'OeaWorkspaceStore.KIND_PAIR' "$WS"
          grep -Fq 'NotificationListenerService.requestRebind' "$WS"
          grep -Fq 'class OeaDrawerView' $SRC/workspace/OeaDrawerView.kt
          grep -Fq 'class AlphabetRail' $SRC/workspace/OeaDrawerView.kt
          grep -Fq 'startAppWidgetConfigureActivityForResult' $SRC/widgets/OeaWidgetController.kt
          grep -Fq 'ACTION_APPWIDGET_BIND' $SRC/widgets/OeaWidgetController.kt
          grep -Fq 'hasShortcutHostPermission' $SRC/shortcuts/OeaShortcutController.kt
          grep -Fq 'startShortcut' $SRC/shortcuts/OeaShortcutController.kt
          grep -Fq 'fun calculate' $SRC/search/OeaSearchController.kt
          ! grep -Fq 'renderOeaTools' "$WS"
          # Icon packs and shapes.
          grep -Fq 'org.adw.launcher.THEMES' $SRC/icons/OeaIconController.kt
          grep -Fq 'com.novalauncher.THEME' $SRC/icons/OeaIconController.kt
          grep -Fq '"squircle"' $SRC/icons/OeaIconController.kt
          grep -Fq 'External icon pack' $SRC/OeaSystemToolsActivity.kt
          grep -Fq '"Animation speed"' $SRC/OeaSystemToolsActivity.kt
          # OEA Assistant (lock, notifications, Recents, no-root freezer).
          grep -Fq 'GLOBAL_ACTION_LOCK_SCREEN' $SRC/assistant/OeaAssistant.kt
          grep -Fq 'ACTION_APPLICATION_DETAILS_SETTINGS' $SRC/assistant/OeaAssistantService.kt
          grep -Fq 'android:id/button1' $SRC/assistant/OeaAssistantService.kt
      - name: Verify multitasking, Overview, Game Boost, Phone and Call Blocker
        run: |
          set -euo pipefail
          SRC=oea/src/main/java/com/oea/launcher
          TOOLS=$SRC/OeaSystemToolsActivity.kt
          grep -Fq "originalDndFilter" $SRC/gameboost/OeaGameBoostService.kt
          grep -Fq "beginDndSession" $SRC/gameboost/OeaGameBoostService.kt
          grep -Fq "class OeaGameBoostActivity" $SRC/gameboost/OeaGameBoostActivity.kt
          grep -Fq "OeaGameBoostService.ACTION_REFRESH" $SRC/gameboost/OeaGameBoostActivity.kt
          grep -Fq "calculateLaunchBounds" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "options.launchBounds = bounds" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "Intent.FLAG_ACTIVITY_NEW_TASK" $SRC/multitask/OeaMultitaskLauncher.kt
          ! grep -Fq "Intent.FLAG_ACTIVITY_CLEAR_TOP" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "currentWindowMetrics.bounds" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq '"small" -> 320 to 440' $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq '"medium" -> 420 to 560' $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq '"large" -> 520 to 700' $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "android.software.freeform_window_management" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "android.activity.windowingMode" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT" $SRC/split/OeaSplitLauncher.kt
          ! grep -Fq "Intent.FLAG_ACTIVITY_CLEAR_TOP" $SRC/split/OeaSplitLauncher.kt
          grep -Fq "toggleSplitScreen" $SRC/split/OeaSplitLauncher.kt
          grep -Fq "Search apps or package names" "$TOOLS"
          grep -Fq "Overview" "$TOOLS"
          grep -Fq "UsageStatsManager" "$TOOLS"
          grep -Fq 'overviewTab("Recent use")' "$TOOLS"
          grep -Fq 'overviewTab("All apps")' "$TOOLS"
          grep -Fq "Clear OEA list" "$TOOLS"
          grep -Fq "Restore cards" "$TOOLS"
          grep -Fq "Android tasks were not closed" "$TOOLS"
          grep -Fq "overviewNow - usedAt <= sevenDaysMillis" "$TOOLS"
          grep -Fq '"Lock this app"' "$TOOLS"
          grep -Fq "Open as floating window" "$TOOLS"
          grep -Fq "App info / force stop" "$TOOLS"
          grep -Fq "val cardRail = HorizontalScrollView(this)" "$TOOLS"
          grep -Fq "dp(284)" "$TOOLS"
          grep -Fq "does not provide OEA a live task snapshot" "$TOOLS"
          grep -Fq '"call_blocker" -> { openActivity(OeaCallBlockerActivity::class.java)' "$TOOLS"
          grep -Fq '"blocked" to "Blocked", "allowed" to "Allowed", "rules" to "Rules", "history" to "History"' $SRC/callblocker/OeaCallBlockerActivity.kt
          grep -Fq 'fun getAllowList' $SRC/callblocker/OeaCallScreeningService.kt
          grep -Fq 'fun blockedHistory' $SRC/callblocker/OeaCallScreeningService.kt
          grep -Fq 'class OeaPhoneActivity' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun loadContacts()' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun loadBlockedHistory()' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private const val TAB_DIAL' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun renderContacts()' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'rowClick: (() -> Unit)? = null' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'action = { placeCall(contact.phone) }' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'addTextChangedListener' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'placeCall(contact.phone)' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun openDialer(uri: Uri)' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Phone number or USSD code' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'TAB_CONTACTS' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'ACTION_CHANGE_DEFAULT_DIALER' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'consumeDialIntent(intent)' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun consumeDialIntent(source: Intent?)' $SRC/phone/OeaPhoneActivity.kt
          ! grep -Fq 'startActivity(Intent(Intent.ACTION_CALL' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Choose SIM for this call' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'callCapablePhoneAccounts' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'TelecomManager.EXTRA_PHONE_ACCOUNT_HANDLE' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Compact floating card' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Incoming-call flash alert' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'setTorchMode' $SRC/phone/OeaInCallService.kt
      - name: Verify launcher engine and Home live activities
        run: |
          set -euo pipefail
          SRC=oea/src/main/java/com/oea/launcher
          ENGINE=$SRC/engine/OeaLauncherEngine.kt
          NOTIFICATIONS=$SRC/notifications/OeaNotificationListener.kt
          ISLAND=$SRC/workspace/OeaDynamicIslandView.kt
          WORKSPACE=$SRC/workspace/OeaWorkspace.kt
          grep -Fq "Executors.newSingleThreadExecutor" "$ENGINE"
          grep -Fq "model.query()" "$ENGINE"
          grep -Fq "OeaWorkspace(ContextThemeWrapper" "$ENGINE"
          grep -Fq "fun dynamicIslandEnabled()" "$SRC/data/OeaDataStore.kt"
          grep -Fq "OeaDynamicIslandView(context)" "$WORKSPACE"
          grep -Fq "MediaController" "$ISLAND"
          grep -Fq "transport.skipToNext()" "$ISLAND"
          grep -Fq "Notification.CATEGORY_CALL" "$NOTIFICATIONS"
          grep -Fq "Notification.Action" "$ISLAND"
          grep -Fq "OeaCallState" "$ISLAND"
          ! grep -Fq "TYPE_APPLICATION_OVERLAY" "$NOTIFICATIONS"
          ! grep -Fq "WindowManager" "$NOTIFICATIONS"
      - name: Verify OEA Game Engine and games
        run: |
          set -e
          E=oea-engine/src/main/java/com/oea/engine
          G=oea-games/src/main/java/com/oea/games
          L=oea/src/main/java/com/oea/launcher
          for f in $E/core/GameHost.kt $E/core/GameApi.kt $E/graphics/Renderer3D.kt $E/graphics/Graphics.kt \
                   $E/net/session/NetSession.kt $E/net/lan/LanDiscovery.kt $E/net/rtc/RtcLink.kt $E/net/rtc/SignalCode.kt \
                   $E/net/qr/Qr.kt $E/island/Island.kt $E/perf/PerformanceManager.kt $E/math/nd/HyperSpace.kt \
                   $G/chess/ChessRules.kt $G/chess/ChessAi.kt $G/runner/OeaRunner.kt $G/arena/OeaArena.kt \
                   $L/games/OeaGamesActivity.kt $L/games/OeaGameActivity.kt $L/games/OeaGameIslandHost.kt; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          grep -q "fun perft" $G/chess/ChessRules.kt
          grep -q "livekit.org.webrtc" $E/net/rtc/RtcLink.kt
          grep -q "IslandRouting" $E/island/Island.kt
          grep -q "OeaGameLiveState" $L/workspace/OeaDynamicIslandView.kt
          grep -q "OeaLauncherIslandHost" $L/OeaApplication.kt
          grep -q "com.oea.launcher.games.OeaGamesActivity" oea/src/main/AndroidManifest.xml
          # Online play only ever uses the user's own STUN/TURN servers: no public ones may be hardcoded.
          if grep -rEn "stun:[a-z0-9.-]+[.](com|org|net|io)|google[.]com:19302" oea-engine/src/main oea-games/src/main oea/src/main; then
            echo "ERROR: a public STUN/TURN server is hardcoded."
            exit 1
          fi
      - name: Build standalone OEA Launcher APK
        run: |
          set -o pipefail
          if ! ./gradlew :oea:assembleRelease :oea-game-arena:assembleRelease :oea-game-chess:assembleRelease :oea-game-runner:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface compiler/lint errors as annotations so they are visible
            # without downloading the full log.
            {
              grep -E '^e: ' "$RUNNER_TEMP/gradle.log" || true
              grep -E '(^|[^A-Za-z])(error|Error|ERROR):' "$RUNNER_TEMP/gradle.log" | grep -vE '^e: ' || true
              grep -A4 'What went wrong' "$RUNNER_TEMP/gradle.log" || true
            } | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | awk '!seen[$0]++' | head -10 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            exit 1
          fi
      - name: Run engine and game unit tests
        run: |
          # Chess rules (perft), connection codes, math and N-D geometry.
          if ! ./gradlew :oea-engine:testDebugUnitTest :oea-games:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            {
              grep -E '^e: ' "$RUNNER_TEMP/tests.log" || true
              grep -E 'FAILED|AssertionError|Exception:' "$RUNNER_TEMP/tests.log" | grep -vE '^e: ' || true
              grep -A4 'What went wrong' "$RUNNER_TEMP/tests.log" || true
            } | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | awk '!seen[$0]++' | head -10 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            exit 1
          fi
          TOTAL=$(cat oea-engine/build/test-results/testDebugUnitTest/*.xml oea-games/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -o '<testsuite [^>]*tests="[0-9]*"' | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "::notice::OEA engine and game unit tests passed: $TOTAL tests"
          test "$TOTAL" -gt 0
      - name: Verify APK identity
        run: |
          APK="$(find oea/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "package: name='com.oea.launcher'"
          if "$AAPT2" dump badging "$APK" | grep -Fq "com.android.launcher3"; then
            echo "ERROR: Launcher3 identity remains in the APK."
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$RUNNER_TEMP/OEA-latest.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oea-launcher-apk
          path: oea/build/outputs/apk/**/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view oea-latest >/dev/null 2>&1; then
            # --clobber replaces the old asset. This job is serialized above to
            # prevent another push from deleting the asset during this upload.
            gh release upload oea-latest "$RUNNER_TEMP/OEA-latest.apk" --clobber
          else
            gh release create oea-latest "$RUNNER_TEMP/OEA-latest.apk" --title "OEA Latest" --notes "Latest standalone OEA Launcher build from main."
          fi
