name: OEA Launcher APK

permissions:
  contents: write

# Serialize release publication: rapid pushes must not concurrently delete/upload
# the same OEA-latest.apk asset, which can produce uploads.github.com 404s.
concurrency:
  group: oea-apk-release
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OEA
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Verify App Freezer integration
        run: |
          set -euo pipefail
          grep -Fq "setPackagesSuspended" oea/src/main/java/com/oea/launcher/applock/OeaAppFreezer.kt
          grep -Fq "isPackageSuspended" oea/src/main/java/com/oea/launcher/applock/OeaAppFreezer.kt
          grep -Fq "rootSuspensionState(packageName)" oea/src/main/java/com/oea/launcher/applock/OeaAppFreezer.kt
          grep -Fq "Android did not confirm the requested frozen state" oea/src/main/java/com/oea/launcher/applock/OeaAppFreezer.kt
          grep -Fq "android.intent.category.HOME" oea/src/main/AndroidManifest.xml
          grep -Fq "android.intent.category.DEFAULT" oea/src/main/AndroidManifest.xml
          grep -Fq "dumpsys package" oea/src/main/java/com/oea/launcher/applock/OeaAppFreezer.kt
          grep -Fq "SELECT VISIBLE" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "REFRESH STATE" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "freezerOperationRunning" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          ! grep -Fq "adb shell dpm set-device-owner" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          ! grep -Fq "Copy Device Owner command" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          ! grep -Fq "DEVICE OWNER SETUP" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "loadInstalledFreezerApps" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "QUERY_ALL_PACKAGES" oea/src/main/AndroidManifest.xml
          grep -Fq "originalDndFilter" oea/src/main/java/com/oea/launcher/gameboost/OeaGameBoostService.kt
          grep -Fq "beginDndSession" oea/src/main/java/com/oea/launcher/gameboost/OeaGameBoostService.kt
          grep -Fq "calculateLaunchBounds" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          grep -Fq "options.launchBounds = bounds" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          grep -Fq "Intent.FLAG_ACTIVITY_NEW_TASK" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          ! grep -Fq "Intent.FLAG_ACTIVITY_CLEAR_TOP" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          grep -Fq "Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT" oea/src/main/java/com/oea/launcher/split/OeaSplitLauncher.kt
          ! grep -Fq "Intent.FLAG_ACTIVITY_CLEAR_TOP" oea/src/main/java/com/oea/launcher/split/OeaSplitLauncher.kt
          grep -Fq "Search apps or package names" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "Overview" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "UsageStatsManager" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'overviewTab("Recent use")' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "Clear OEA list" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "Restore cards" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "Android tasks were not closed" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'overviewTab("All apps")' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "overviewNow - usedAt <= sevenDaysMillis" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq '"Lock this app"' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "Open as floating window" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "App info / force stop" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "android:excludeFromRecents=\"true\"" oea/src/main/AndroidManifest.xml
          grep -Fq "val cardRail = android.widget.HorizontalScrollView(this)" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "dp(284)" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq "does not provide OEA a live task snapshot" oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'private fun openDrawer()' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'DecelerateInterpolator' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'org.adw.launcher.THEMES' oea/src/main/java/com/oea/launcher/icons/OeaIconController.kt
          grep -Fq 'com.novalauncher.THEME' oea/src/main/java/com/oea/launcher/icons/OeaIconController.kt
          grep -Fq 'External icon pack' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'private fun applyIconShape' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq '"squircle"' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'outline.setConvexPath(path)' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'widgetScroll' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'val count = cols() * 4' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'row(box, "Animation speed"' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'store.animationDuration(180)' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq '.removePrefix("oea_widget:")?.toIntOrNull()' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'animate().alpha(1f).scaleX(1f).scaleY(1f)' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'ActivityOptions.makeCustomAnimation' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'section(box, "ALLOWED NUMBERS")' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'section(box, "BLOCKED CALL HISTORY")' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'class OeaPhoneActivity' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun loadContacts()' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun loadBlockedHistory()' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'private const val TAB_DIAL' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun renderContacts()' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'rowClick: (() -> Unit)? = null' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'action = { placeCall(contact.phone) }' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'addTextChangedListener' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'placeCall(contact.phone)' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun openDialer(uri: Uri)' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'private var callBlockerTab = "blocked"' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq '"blocked" to "Blocked"' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq '"allowed" to "Allowed"' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq '"rules" to "Rules"' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq '"history" to "History"' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          source = Path("oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt").read_text()
          render_block = source.split("private fun renderOeaTools()", 1)[1].split("private fun drawerTile", 1)[0]
          tools_list = render_block.split("val tools = listOf(", 1)[1].split(")", 1)[0]
          forbidden = ("App Freezer", "Multitask", "Split Screen")
          found = [name for name in forbidden if name in tools_list]
          if found:
              raise SystemExit("System-only tools leaked into All Apps OEA Systems grid: " + ", ".join(found))
          PY
          grep -Fq "Open OEA multitasking overview" oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq "currentWindowMetrics.bounds" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          grep -Fq "preferredWidthDp = 420" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          grep -Fq "preferredHeightDp = 560" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          grep -Fq "android.software.freeform_window_management" oea/src/main/java/com/oea/launcher/multitask/OeaMultitaskLauncher.kt
          grep -Fq 'org.adw.launcher.THEMES' oea/src/main/java/com/oea/launcher/icons/OeaIconController.kt
          grep -Fq 'com.novalauncher.THEME' oea/src/main/java/com/oea/launcher/icons/OeaIconController.kt
          grep -Fq 'External icon pack' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'private fun applyIconShape' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq '"squircle"' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'fun getAllowList' oea/src/main/java/com/oea/launcher/callblocker/OeaCallScreeningService.kt
          grep -Fq 'fun blockedHistory' oea/src/main/java/com/oea/launcher/callblocker/OeaCallScreeningService.kt
          grep -Fq 'BLOCKED CALL HISTORY' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'ALLOWED NUMBERS' oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          grep -Fq 'Phone number or USSD code' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'TAB_CONTACTS' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'ACTION_CHANGE_DEFAULT_DIALER' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'Choose SIM for this call' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'callCapablePhoneAccounts' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'TelecomManager.EXTRA_PHONE_ACCOUNT_HANDLE' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'Compact floating card' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'Incoming-call flash alert' oea/src/main/java/com/oea/launcher/phone/OeaPhoneActivity.kt
          grep -Fq 'setTorchMode' oea/src/main/java/com/oea/launcher/phone/OeaInCallService.kt
          grep -Fq 'tag = widget.appWidgetId' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'val childId = child.tag as? Int' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          grep -Fq 'renderedPages.toList().forEach { refreshPage(it) }' oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          python3 - <<'PY'
          from pathlib import Path
          source = Path("oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt").read_text()
          render_block = source.split("private fun renderOeaTools()", 1)[1].split("private fun drawerTile", 1)[0]
          tools_list = render_block.split("val tools = listOf(", 1)[1].split(")", 1)[0]
          forbidden = ("App Freezer", "Multitask", "Split Screen")
          found = [name for name in forbidden if name in tools_list]
          if found:
              raise SystemExit("System-only tools leaked into All Apps OEA Systems grid: " + ", ".join(found))
          PY
      - name: Build standalone OEA Launcher APK
        run: ./gradlew :oea:assembleRelease --stacktrace
      - name: Verify APK identity
        run: |
          APK="$(find oea/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "package: name='com.oea.launcher'"
          if "$AAPT2" dump badging "$APK" | grep -Fq "com.android.launcher3"; then
            echo "ERROR: Launcher3 identity remains in the APK."
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$RUNNER_TEMP/OEA-latest.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oea-launcher-apk
          path: oea/build/outputs/apk/**/*.apk
          retention-days: 1
          if-no-files-found: error
      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view oea-latest >/dev/null 2>&1; then
            # --clobber replaces the old asset. This job is serialized above to
            # prevent another push from deleting the asset during this upload.
            gh release upload oea-latest "$RUNNER_TEMP/OEA-latest.apk" --clobber
          else
            gh release create oea-latest "$RUNNER_TEMP/OEA-latest.apk" --title "OEA Latest" --notes "Latest standalone OEA Launcher build from main."
          fi
