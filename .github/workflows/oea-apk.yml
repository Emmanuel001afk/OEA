name: OEA Launcher APK

permissions:
  contents: write
  # Needed by the "Comment Gradle error on PR" step: without this the comment
  # call is refused and a red PR shows no reason anyone can read.
  pull-requests: write

# Serialize release publication: rapid pushes must not concurrently delete/upload
# the same OEA-latest.apk asset, which can produce uploads.github.com 404s.
concurrency:
  # Keep main/release publication serialized, but cancel obsolete runs of the same PR
  # so a stale compiler job cannot block validation of the newest fix commit.
  group: oea-apk-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OEA
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Static check (Kotlin structure, app registration, manifests)
        # Catches the class of fault a compile cannot see here: a mini-app or a
        # game that is listed in Kotlin but missing from the manifest, or a game
        # entry Game Boost does not recognise. Runs before the build so the
        # failure is readable.
        run: python3 tools/check-kotlin.py
      - name: Compile Kotlin (launcher, engine, arcade)
        # A dedicated compile before the tests: when a type error stops the
        # build, this step names it as a `:error:` annotation on the exact file
        # and line instead of failing later inside a camera test with a log
        # nobody can read. It compiles the debug variant, which pulls in
        # :oea-engine and :oea-games exactly as the release build does.
        run: |
          set -o pipefail
          if ! ./gradlew :oea:compileDebugKotlin --stacktrace 2>&1 | tee "$RUNNER_TEMP/compile.log"; then
            { grep -E '^e: ' "$RUNNER_TEMP/compile.log" || true; } | head -80 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            exit 1
          fi
      - name: Camera geometry regression tests
        run: |
          set -o pipefail
          if ! ./gradlew :oea:testDebugUnitTest --tests 'com.oea.launcher.camera.OeaCameraOpticsTest' --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            { grep -E '^e: |FAILED|AssertionError|Exception:|What went wrong' "$RUNNER_TEMP/gradle.log" || true; } | head -60 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            exit 1
          fi
      - name: Search ranking regression tests
        run: |
          set -o pipefail
          if ! ./gradlew :oea:testDebugUnitTest --tests 'com.oea.launcher.search.OeaSearchIndexTest' --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-search.log"; then
            { grep -E '^e: |FAILED|AssertionError|Exception:|What went wrong' "$RUNNER_TEMP/gradle-search.log" || true; } | head -60 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            exit 1
          fi
      - name: Use the stable OEA signing key (optional)
        # Without this, every runner creates a new random debug key, so each
        # APK has a different signature and cannot update the previous one
        # (Android refuses the update; uninstalling wipes OEA's layout and
        # settings). Add the repository secret OEA_DEBUG_KEYSTORE_BASE64 (a
        # base64 keystore using the standard debug credentials: alias
        # androiddebugkey, passwords "android") and every build is signed with
        # it. Without the secret this step does nothing.
        env:
          OEA_DEBUG_KEYSTORE_BASE64: ${{ secrets.OEA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${OEA_DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$OEA_DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "::notice::Signing with the stable OEA key from OEA_DEBUG_KEYSTORE_BASE64."
          else
            echo "::warning::OEA_DEBUG_KEYSTORE_BASE64 is not set: this APK is signed with a new random key and cannot update a previously installed OEA in place."
          fi
      - name: Verify App Freezer integration
        run: |
          set -euo pipefail
          FREEZER=oea/src/main/java/com/oea/launcher/applock/OeaAppFreezer.kt
          TOOLS=oea/src/main/java/com/oea/launcher/OeaSystemToolsActivity.kt
          MANIFEST=oea/src/main/AndroidManifest.xml
          grep -Fq "setPackagesSuspended" "$FREEZER"
          grep -Fq "isPackageSuspended" "$FREEZER"
          grep -Fq "rootSuspensionState(packageName)" "$FREEZER"
          grep -Fq "Android did not confirm the requested frozen state" "$FREEZER"
          grep -Fq "dumpsys package" "$FREEZER"
          grep -Fq "fun hibernatedPackages" "$FREEZER"
          grep -Fq "android.intent.category.HOME" "$MANIFEST"
          grep -Fq "android.intent.category.DEFAULT" "$MANIFEST"
          grep -Fq "QUERY_ALL_PACKAGES" "$MANIFEST"
          grep -Fq "SELECT VISIBLE" "$TOOLS"
          grep -Fq "REFRESH STATE" "$TOOLS"
          grep -Fq "freezerOperationRunning" "$TOOLS"
          grep -Fq "loadInstalledFreezerApps" "$TOOLS"
          ! grep -Fq "adb shell dpm set-device-owner" "$TOOLS"
          ! grep -Fq "Copy Device Owner command" "$TOOLS"
          ! grep -Fq "DEVICE OWNER SETUP" "$TOOLS"
      - name: Verify smart folders are identified from the phone, not written down
        # Smart folders used to read a catalogue typed by hand, and folder titles
        # wrote a guessed category word into the layout. Both are regressions a
        # compile cannot see: the app still builds, it just starts inventing names
        # again. Families must come from facts the phone owns (shared uid, signing
        # certificate, publisher namespace) and names must be derived and maintained
        # automatically.
        run: |
          set -euo pipefail
          MODEL=oea/src/main/java/com/oea/launcher/model/OeaAppModel.kt
          FAMILIES=oea/src/main/java/com/oea/launcher/workspace/OeaAppFamilies.kt
          SMART=oea/src/main/java/com/oea/launcher/workspace/OeaSmartFolders.kt
          WS=oea/src/main/java/com/oea/launcher/workspace/OeaWorkspace.kt
          TILES=oea/src/main/java/com/oea/launcher/workspace/OeaHomeViews.kt
          ICONS=oea/src/main/java/com/oea/launcher/icons/OeaIconController.kt
          # The uid is carried from PackageManager through the catalogue to discovery.
          grep -Fq "uid = appInfo.uid" "$MODEL"
          grep -Fq "val uid: Int = 0" "$MODEL"
          grep -Fq "SHARED_UID" "$FAMILIES"
          grep -Fq "SHARED_SIGNATURE" "$FAMILIES"
          grep -Fq "GET_SIGNING_CERTIFICATES" "$SMART"
          grep -Fq "namespaceOf(" "$FAMILIES"
          grep -Fq "OeaAppFamilies.discover(" "$SMART"
          # No written catalogue, and no licence to name families by hand.
          ! grep -Fq "CATALOGUE" "$SMART"
          ! grep -Fq "com.google." "$SMART"
          ! grep -Fq "com.microsoft." "$SMART"
          ! grep -Fq "com.transsion" "$SMART"
          # Titles are OEA's own and are replaced when the family changes; a name
          # the user wrote is never touched, which is what the written title is for.
          grep -Fq "KEY_WRITTEN_TITLE" "$SMART"
          # A folder made by dropping one app on another gets a plain name: no
          # ApplicationInfo category is turned into a word and stored.
          ! grep -Fq "CATEGORY_GAME" "$WS"
          ! grep -Fq "CATEGORY_SOCIAL" "$WS"
          grep -Fq "internal fun suggestFolderName" "$WS"
          # A missing icon is drawn as a plate, and one failed resolve retries
          # instead of leaving the tile blank for the session.
          grep -Fq "drawIconPlate" "$TILES"
          grep -Fq "attempt(1)" "$ICONS"
      - name: Verify launcher identity and required launcher features
        run: |
          set -euo pipefail
          SRC=oea/src/main/java/com/oea/launcher
          MANIFEST=oea/src/main/AndroidManifest.xml
          WS=$SRC/workspace/OeaWorkspace.kt
          # Home role, wallpaper window and own-app identities.
          grep -Fq 'android:excludeFromRecents="true"' "$MANIFEST"
          grep -Fq 'android:theme="@style/OeaHomeTheme"' "$MANIFEST"
          grep -Fq 'android:windowShowWallpaper' oea/src/main/res/values/styles.xml
          grep -Fq 'android.content.pm.action.CONFIRM_PIN_SHORTCUT' "$MANIFEST"
          grep -Fq 'android.content.pm.action.CONFIRM_PIN_APPWIDGET' "$MANIFEST"
          grep -Fq 'com.oea.launcher.gameboost.OeaGameBoostActivity' "$MANIFEST"
          grep -Fq 'android:label="Game Boost"' "$MANIFEST"
          grep -Fq '@drawable/ic_oea_game_boost' "$MANIFEST"
          grep -Fq 'android:label="OEA Settings"' "$MANIFEST"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -Fq 'android.permission.SET_WALLPAPER' "$MANIFEST"
          grep -Fq 'android.permission.REQUEST_DELETE_PACKAGES' "$MANIFEST"
          test "$(grep -c 'android.intent.category.LAUNCHER' "$MANIFEST")" -ge 6
          # OEA Home: launching, gestures, drag and drop, widgets, pairs.
          grep -Fq 'fun onHomeIntent(alreadyOnHome: Boolean)' "$WS"
          grep -Fq 'startMainActivity' "$WS"
          grep -Fq 'makeClipRevealAnimation' "$WS"
          grep -Fq 'requestDisallowInterceptTouchEvent(false)' "$WS"
          grep -Fq 'DecelerateInterpolator' "$WS"
          grep -Fq 'private fun widgetRowsOnPage' "$WS"
          grep -Fq 'fun addPinnedWidget' "$WS"
          grep -Fq 'OeaWorkspaceStore.KIND_PAIR' "$WS"
          grep -Fq 'NotificationListenerService.requestRebind' "$WS"
          grep -Fq 'class OeaDrawerView' $SRC/workspace/OeaDrawerView.kt
          grep -Fq 'class AlphabetRail' $SRC/workspace/OeaDrawerView.kt
          grep -Fq 'startAppWidgetConfigureActivityForResult' $SRC/widgets/OeaWidgetController.kt
          grep -Fq 'ACTION_APPWIDGET_BIND' $SRC/widgets/OeaWidgetController.kt
          grep -Fq 'hasShortcutHostPermission' $SRC/shortcuts/OeaShortcutController.kt
          grep -Fq 'startShortcut' $SRC/shortcuts/OeaShortcutController.kt
          grep -Fq 'fun calculate' $SRC/search/OeaSearchController.kt
          ! grep -Fq 'renderOeaTools' "$WS"
          # Icon packs and shapes.
          grep -Fq 'org.adw.launcher.THEMES' $SRC/icons/OeaIconController.kt
          grep -Fq 'com.novalauncher.THEME' $SRC/icons/OeaIconController.kt
          grep -Fq '"squircle"' $SRC/icons/OeaIconController.kt
          grep -Fq 'External icon pack' $SRC/OeaSystemToolsActivity.kt
          grep -Fq '"Animation speed"' $SRC/OeaSystemToolsActivity.kt
          # OEA Assistant (lock, notifications, Recents, no-root freezer).
          grep -Fq 'GLOBAL_ACTION_LOCK_SCREEN' $SRC/assistant/OeaAssistant.kt
          grep -Fq 'ACTION_APPLICATION_DETAILS_SETTINGS' $SRC/assistant/OeaAssistantService.kt
          grep -Fq 'android:id/button1' $SRC/assistant/OeaAssistantService.kt
      - name: Verify multitasking, Overview, Game Boost, Phone and Call Blocker
        run: |
          set -euo pipefail
          SRC=oea/src/main/java/com/oea/launcher
          TOOLS=$SRC/OeaSystemToolsActivity.kt
          # Game Boost must record what a session changed and give it back, and
          # the record has to outlive the process (a killed service used to
          # leave Do Not Disturb switched on for good).
          grep -Fq "OeaGameBoostSessionState.open(this, game)" $SRC/gameboost/OeaGameBoostService.kt
          grep -Fq "OeaGameBoostSessionState.restore(this)" $SRC/gameboost/OeaGameBoostService.kt
          grep -Fq "restoreIfOrphaned(this, sessionRunning = false)" $SRC/gameboost/OeaGameBoostService.kt
          grep -Fq "fun restoreTarget" $SRC/gameboost/OeaGameBoostSessionState.kt
          grep -Fq "fun restoreIfOrphaned" $SRC/gameboost/OeaGameBoostSessionState.kt
          grep -Fq "class OeaGameBoostActivity" $SRC/gameboost/OeaGameBoostActivity.kt
          grep -Fq "OeaGameBoostService.ACTION_REFRESH" $SRC/gameboost/OeaGameBoostActivity.kt
          grep -Fq "calculateLaunchBounds" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "options.launchBounds = bounds" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "Intent.FLAG_ACTIVITY_NEW_TASK" $SRC/multitask/OeaMultitaskLauncher.kt
          ! grep -Fq "Intent.FLAG_ACTIVITY_CLEAR_TOP" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "currentWindowMetrics.bounds" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq '"small" -> 320 to 440' $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq '"medium" -> 420 to 560' $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq '"large" -> 520 to 700' $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "android.software.freeform_window_management" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "android.activity.windowingMode" $SRC/multitask/OeaMultitaskLauncher.kt
          # One resolver decides what "this app" means for every multitasking
          # surface. A package-level answer opened OEA Home for every OEA tool,
          # because they all share one package, and gave up when an update
          # renamed or disabled the activity OEA was holding.
          grep -Fq "object OeaMultitaskIntents" $SRC/multitask/OeaMultitaskIntents.kt
          grep -Fq "fun resolve(context: Context, packageName: String, className: String?)" $SRC/multitask/OeaMultitaskIntents.kt
          grep -Fq "fun record(context: Context, packageName: String, className: String?)" $SRC/multitask/OeaMultitaskIntents.kt
          # OEA Home is itself a launcher activity, so a package-level fallback
          # has to prefer the activities that are not home screens.
          grep -Fq "Intent.CATEGORY_HOME" $SRC/multitask/OeaMultitaskIntents.kt
          grep -Fq "private fun ranked(context: Context, packageName: String)" $SRC/multitask/OeaMultitaskIntents.kt
          grep -Fq "OeaMultitaskIntents.resolve(context, app)" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "OeaMultitaskIntents.record(context, app)" $SRC/multitask/OeaMultitaskLauncher.kt
          grep -Fq "OeaMultitaskIntents.resolve(service, packageName, className)" $SRC/multitask/projection/OeaLiveWindowManager.kt
          grep -Fq "OeaMultitaskIntents.record(service, packageName, activityName)" $SRC/multitask/projection/OeaLiveWindowManager.kt
          grep -Fq "OeaMultitaskIntents.resolve(context, first)" $SRC/split/OeaSplitLauncher.kt
          # No multitasking surface may ask the package instead of the component.
          ! grep -Fq "getLaunchIntentForPackage" $SRC/multitask/OeaMultitaskLauncher.kt
          ! grep -Fq "getLaunchIntentForPackage" $SRC/split/OeaSplitLauncher.kt
          ! grep -Fq "getLaunchIntentForPackage" $SRC/multitask/projection/OeaLiveWindowManager.kt
          # The OEA floating workspace must remember which app was asked for.
          grep -Fq "service.openApp(app)" $SRC/multitask/OeaFloatingWindows.kt
          grep -Fq "fun openApp(app: OeaAppInfo)" $SRC/multitask/OeaFloatingWindowService.kt
          # Pairing and live windows are per component, not per package.
          grep -Fq "fun find(pkg: String, className: String?)" $SRC/multitask/projection/OeaLiveWindowManager.kt
          grep -Fq "first.packageName == second.packageName && first.className == second.className" $SRC/split/OeaSplitLauncher.kt
          grep -Fq "Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT" $SRC/split/OeaSplitLauncher.kt
          ! grep -Fq "Intent.FLAG_ACTIVITY_CLEAR_TOP" $SRC/split/OeaSplitLauncher.kt
          grep -Fq "toggleSplitScreen" $SRC/split/OeaSplitLauncher.kt
          # Live windows: the projection must be able to SEE the private
          # display. AccessibilityService.getWindows() returns the phone
          # screen's windows only (verified in AccessibilityInteractionClient
          # on Android 13/14/15), so a window-verified launch, watchdog and
          # node input all have to read getWindowsOnAllDisplays().
          grep -Fq "fun canSeePrivateDisplays" $SRC/multitask/projection/OeaProjectionController.kt
          grep -Fq "getWindowsOnAllDisplays()" $SRC/multitask/projection/OeaProjectionController.kt
          # A package filter that also accepts OEA's own package is not a
          # package filter: it let any OEA window stand in for the target.
          grep -Fq "includeOwnWindows" $SRC/multitask/projection/OeaProjectionController.kt
          ! grep -Fq "OEA_SELF_PACKAGE_FALLBACK) {" $SRC/multitask/projection/OeaProjectionController.kt
          # Android's precondition, checked before a display is ever created.
          grep -Fq "object OeaProjectionPolicy" $SRC/multitask/projection/OeaProjectionPolicy.kt
          grep -Fq "fun check(context: Context, packageName: String, className: String?)" $SRC/multitask/projection/OeaProjectionPolicy.kt
          grep -Fq "FLAG_ALLOW_EMBEDDED = 0x80000000" $SRC/multitask/projection/OeaProjectionPolicy.kt
          grep -Fq "OeaProjectionPolicy.check(service, packageName, activityName)" $SRC/multitask/projection/OeaLiveWindowManager.kt
          grep -Fq "OeaProjectionPolicy.check(service, packageName, activityName)" $SRC/multitask/projection/OeaProjectionLaunch.kt
          # No live window may claim to be live without a picture in it.
          grep -Fq "awaitNewFrameSince" $SRC/multitask/projection/OeaLiveWindowSession.kt
          grep -Fq "startReaderDrain()" $SRC/multitask/projection/OeaLiveWindowSession.kt
          # OEA's own apps must declare allowEmbedded to be projectable.
          grep -Fq 'android:allowEmbedded="true"' oea/src/main/AndroidManifest.xml
          # Picture-in-picture on a phone Android gave none. FEATURE_PICTURE_IN_PICTURE
          # is a device feature: without it no app can enter the system PiP task, so
          # VIP must fall back to OEA's own floating window.
          grep -Fq "class OeaPipWindow" $SRC/multitask/pip/OeaPipWindow.kt
          grep -Fq "TYPE_ACCESSIBILITY_OVERLAY" $SRC/multitask/pip/OeaPipWindow.kt
          grep -Fq "object OeaVipPip" $SRC/miniapps/OeaVipPip.kt
          grep -Fq "fun blocked(context: Context)" $SRC/miniapps/OeaVipPip.kt
          grep -Fq "private fun platformPipAvailable()" $SRC/miniapps/OeaVipPlayerActivity.kt
          grep -Fq "OeaVipPip.blocked(this)" $SRC/miniapps/OeaVipPlayerActivity.kt
          grep -Fq "OeaVipPip.start(applicationContext, handoff, at)" $SRC/miniapps/OeaVipPlayerActivity.kt
          grep -Fq "if (OeaVipPip.showing()) OeaVipPip.stop()" $SRC/miniapps/OeaVipPlayerActivity.kt
          grep -Fq "Search apps or package names" "$TOOLS"
          grep -Fq "Overview" "$TOOLS"
          grep -Fq "UsageStatsManager" "$TOOLS"
          grep -Fq 'overviewTab("Recent use")' "$TOOLS"
          grep -Fq 'overviewTab("All apps")' "$TOOLS"
          grep -Fq "Clear OEA list" "$TOOLS"
          grep -Fq "Restore cards" "$TOOLS"
          grep -Fq "Android tasks were not closed" "$TOOLS"
          grep -Fq "overviewNow - usedAt <= sevenDaysMillis" "$TOOLS"
          grep -Fq '"Lock this app"' "$TOOLS"
          grep -Fq "Open as floating window" "$TOOLS"
          grep -Fq "App info / force stop" "$TOOLS"
          grep -Fq "val cardRail = HorizontalScrollView(this)" "$TOOLS"
          grep -Fq "dp(284)" "$TOOLS"
          grep -Fq "does not provide OEA a live task snapshot" "$TOOLS"
          grep -Fq '"call_blocker" -> { openActivity(OeaCallBlockerActivity::class.java)' "$TOOLS"
          grep -Fq '"blocked" to "Blocked", "allowed" to "Allowed", "rules" to "Rules", "history" to "History"' $SRC/callblocker/OeaCallBlockerActivity.kt
          grep -Fq 'fun getAllowList' $SRC/callblocker/OeaCallScreeningService.kt
          grep -Fq 'fun blockedHistory' $SRC/callblocker/OeaCallScreeningService.kt
          grep -Fq 'class OeaPhoneActivity' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun loadContacts()' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun loadBlockedHistory()' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private const val TAB_DIAL' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun renderContacts()' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'rowClick: (() -> Unit)? = null' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'action = { placeCall(contact.phone) }' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'addTextChangedListener' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'placeCall(contact.phone)' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun openDialer(uri: Uri)' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Phone number or USSD code' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'TAB_CONTACTS' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'ACTION_CHANGE_DEFAULT_DIALER' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'consumeDialIntent(intent)' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'private fun consumeDialIntent(source: Intent?)' $SRC/phone/OeaPhoneActivity.kt
          ! grep -Fq 'startActivity(Intent(Intent.ACTION_CALL' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Choose SIM for this call' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'callCapablePhoneAccounts' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'TelecomManager.EXTRA_PHONE_ACCOUNT_HANDLE' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Compact floating card' $SRC/phone/OeaPhoneActivity.kt
          grep -Fq 'Incoming-call flash alert' $SRC/phone/OeaPhoneActivity.kt
          # The ring-flash alert, the Quick controls tile, the Home gesture and the
          # voice command all go through the one torch owner, and that owner is what
          # actually calls setTorchMode. Checking the pref here proves the alert is
          # still gated on the user's choice.
          grep -Fq 'OeaTorch' $SRC/phone/OeaInCallService.kt
          grep -Fq 'flash_alert' $SRC/phone/OeaInCallService.kt
          grep -Fq 'setTorchMode' $SRC/camera/OeaTorch.kt
      - name: Verify the camera and the torch
        run: |
          set -euo pipefail
          SRC=oea/src/main/java/com/oea/launcher
          CAMERA=$SRC/miniapps/OeaCameraApp.kt
          OPTICS=$SRC/camera/OeaCameraOptics.kt
          TORCH=$SRC/camera/OeaTorch.kt
          # A still is captured from the sensor, not screenshotted from the preview.
          grep -Fq 'TEMPLATE_STILL_CAPTURE' "$CAMERA"
          grep -Fq 'ImageFormat.JPEG' "$CAMERA"
          grep -Fq 'JPEG_ORIENTATION' "$CAMERA"
          # TextureView snapshots already include setTransform. Reapplying the
          # matrix would rotate/crop fallback photos twice.
          ! grep -Fq 'fun saveBitmap(' "$CAMERA"
          grep -Fq 'return runCatching { textureView.bitmap }.getOrNull()' "$CAMERA"
          ! grep -Fq 'val matrix = previewMatrix ?: return raw' "$CAMERA"
          # The preview is transformed, so it is upright and cropped, not stretched.
          grep -Fq 'textureView.setTransform' "$CAMERA"
          grep -Fq 'fun rotationDegrees(' "$OPTICS"
          grep -Fq 'fun coverScale(' "$OPTICS"
          # Focus re-arms, and zoom respects what the lens declares.
          grep -Fq 'CONTROL_AF_TRIGGER_IDLE' "$CAMERA"
          grep -Fq 'SCALER_AVAILABLE_MAX_DIGITAL_ZOOM' "$CAMERA"
          # Video is oriented and can carry sound.
          grep -Fq 'TEMPLATE_RECORD' "$CAMERA"
          grep -Fq 'setOrientationHint' "$CAMERA"
          grep -Fq 'RECORD_AUDIO' "$CAMERA"
          # QR uses OEA's own engine scanner, never an external zxing client.
          grep -Fq 'QrScannerView(host)' "$CAMERA"
          grep -Fq 'QrCodes.decode(' "$CAMERA"
          ! grep -Fq 'com.google.zxing.client.android' "$CAMERA"
          # Document mode really flattens the page.
          grep -Fq 'CaptureMode.DOC -> document(' $SRC/miniapps/OeaCameraEffects.kt
          # The camera is released when the screen goes away.
          grep -Fq 'onSurfaceTextureDestroyed' "$CAMERA"
          grep -Fq 'pauseHook' "$CAMERA"
          # The viewfinder's own chrome is wired, not decorative: level, REC pill,
          # zoom readout, countdown, gradient scrims.
