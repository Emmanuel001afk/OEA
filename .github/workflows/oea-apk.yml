name: OEA Launcher APK
# Build validation branch

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OEA
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Refresh recursive submodules
        run: |
          git submodule update --init --recursive || true
          if [ ! -d platform_frameworks_libs_systemui/viewcapturelib ]; then
            rm -rf platform_frameworks_libs_systemui
            git clone --depth 1 --branch 16-dev https://github.com/LawnchairLauncher/platform_frameworks_libs_systemui platform_frameworks_libs_systemui
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build OEA Launcher APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(find . -path '*build/outputs/apk/*.apk' | head -n 1)"
          test -n "$APK"
          if gh release view oea-debug >/dev/null 2>&1; then
            gh release upload oea-latest "$APK" --clobber
          else
            gh release create oea-latest "$APK" --title "OEA Latest" --notes "Latest OEA Launcher build from main."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oea-launcher-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
