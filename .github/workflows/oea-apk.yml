      - name: Verify OEA Game Engine and games
        run: |
          set -e
          E=oea-engine/src/main/java/com/oea/engine
          G=oea-games/src/main/java/com/oea/games
          L=oea/src/main/java/com/oea/launcher
          for f in $E/core/GameHost.kt $E/core/GameApi.kt $E/graphics/Renderer3D.kt $E/graphics/Graphics.kt \
                   $E/net/session/NetSession.kt $E/net/lan/LanDiscovery.kt $E/net/rtc/RtcLink.kt $E/net/rtc/SignalCode.kt \
                   $E/net/qr/Qr.kt $E/island/Island.kt $E/perf/PerformanceManager.kt $E/math/nd/HyperSpace.kt \
                   $G/chess/ChessRules.kt $G/chess/ChessAi.kt $G/runner/OeaRunner.kt $G/arena/OeaArena.kt \
                   $L/games/OeaGamesActivity.kt $L/games/OeaGameActivity.kt $L/games/OeaGameIslandHost.kt; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          grep -q "fun perft" $G/chess/ChessRules.kt
          grep -q "livekit.org.webrtc" $E/net/rtc/RtcLink.kt
          grep -q "IslandRouting" $E/island/Island.kt
          grep -q "OeaGameLiveState" $L/workspace/OeaDynamicIslandView.kt
          grep -q "OeaLauncherIslandHost" $L/OeaApplication.kt
          grep -q "com.oea.launcher.games.OeaGamesActivity" oea/src/main/AndroidManifest.xml
          # The games are standalone: each launcher entry is the game's own
          # activity, Game Boost knows all of them, and the shared game shell
          # has its own UI kit (so the installed apps look like OEA, not like a
          # stack of platform dialogs).
          test -f $G/ui/GameUi.kt
          grep -q "class OeaEndlessDaysActivity : OeaStandaloneGameActivity" $L/games/OeaGameEntries.kt
          grep -q "class OeaSendOffActivity : OeaStandaloneGameActivity" $L/games/OeaGameEntries.kt
          grep -q "class OeaChessGameActivity : OeaStandaloneGameActivity" $L/games/OeaGameEntries.kt
          grep -q "oeaGameEntryScreens" $L/games/OeaGameEntries.kt
          grep -q "oeaGameScreens" $L/gameboost/OeaGameBoostService.kt
          # Each game has its own front screen and its own materials: a shooter
          # deck, a chess club room and a rail-arcade marquee. A single shared
          # menu for all three is exactly what this redesign removed, so the
          # three screens and their per-game schemes must stay.
          test -f $G/OeaGameFront.kt && test -f $G/ArenaFront.kt && test -f $G/ChessFront.kt && test -f $G/RunnerFront.kt
          grep -q "class ArenaFront" $G/ArenaFront.kt
          grep -q "class ChessFront" $G/ChessFront.kt
          grep -q "class RunnerFront" $G/RunnerFront.kt
          grep -q "object GameSchemes" $G/ui/GameUi.kt
          grep -q "0xFF38C8EE" $G/ui/GameUi.kt
          grep -q "0xFFF2E8D6" $G/ui/GameUi.kt
          grep -q "0xFF6BCBFF" $G/ui/GameUi.kt
          grep -q "GameFrontHost" $G/OeaStandaloneGameActivity.kt
          # The front screen is locked to the game's own orientation from the
          # icon in, rather than flipping when a match starts.
          grep -q "SCREEN_ORIENTATION_SENSOR_LANDSCAPE" $G/OeaStandaloneGameActivity.kt
          # APK size controls must not be switched off by accident.
          grep -q "minifyEnabled true" oea/build.gradle
          grep -q "abiFilters" oea/build.gradle
          # One APK: the games ship inside the launcher, so the
          # standalone game modules must never come back.
          test ! -d oea-game-runner && test ! -d oea-game-arena && test ! -d oea-game-chess
          # Online play only ever uses the user's own STUN/TURN servers: no public ones may be hardcoded.
          if grep -rEn "stun:[a-z0-9.-]+[.](com|org|net|io)|google[.]com:19302" oea-engine/src/main oea-games/src/main oea/src/main; then
            echo "ERROR: a public STUN/TURN server is hardcoded."
            exit 1
          fi
      - name: Build the single OEA APK (launcher and games)
        run: |
          set -o pipefail
          if ! ./gradlew :oea:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface compiler/lint errors as annotations so they are visible
            # without downloading the full log.
            {
              grep -E '^e: ' "$RUNNER_TEMP/gradle.log" || true
              grep -E '(^|[^A-Za-z])(error|Error|ERROR):' "$RUNNER_TEMP/gradle.log" | grep -vE '^e: ' || true
              grep -A4 'What went wrong' "$RUNNER_TEMP/gradle.log" || true
            } | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | awk '!seen[$0]++' | head -60 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            cat "$RUNNER_TEMP/gradle.log" | tail -n 200
            exit 1
          fi
      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          retention-days: 2
          if-no-files-found: warn
      - name: Comment Gradle error on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The annotations only carry the first errors and a log tail only the last,
          # so a broken module hid half its own list. Quote every compiler error.
          LOG_TAIL=$({ grep -E '^e: ' "$RUNNER_TEMP/gradle.log" || true; } | sed 's#file:///home/runner/work/[^/]*/[^/]*/##;s/`//g' | awk '!seen[$0]++' | head -160 | head -c 60000)
          if [ -z "$LOG_TAIL" ]; then
            LOG_TAIL=$(tail -n 300 "$RUNNER_TEMP/gradle.log" | sed 's/`//g' | head -c 60000)
          fi
          PR=${{ github.event.pull_request.number }}
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "### Gradle build failed
          \`\`\`
          $LOG_TAIL
          \`\`\`" || true
          fi
      - name: Run engine and game unit tests
        run: |
          # Chess rules (perft), connection codes, math and N-D geometry, plus
          # launcher logic (wake gestures, theme catalogue requirements).
          if ! ./gradlew :oea-engine:testDebugUnitTest :oea-games:testDebugUnitTest :oea:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
            {
              grep -E '^e: ' "$RUNNER_TEMP/tests.log" || true
              grep -E 'FAILED|AssertionError|Exception:' "$RUNNER_TEMP/tests.log" | grep -vE '^e: ' || true
              grep -A4 'What went wrong' "$RUNNER_TEMP/tests.log" || true
            } | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | awk '!seen[$0]++' | head -60 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//%/%25}"
            done
            exit 1
          fi
          TOTAL=$(cat oea-engine/build/test-results/testDebugUnitTest/*.xml oea-games/build/test-results/testDebugUnitTest/*.xml oea/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -o '<testsuite [^>]*tests="[0-9]*"' | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "::notice::OEA launcher, engine and game unit tests passed: $TOTAL tests"
          test "$TOTAL" -gt 0
      - name: Verify APK identity
        run: |
          APK="$(find oea/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT2="$BUILD_TOOLS/aapt2"
          "$AAPT2" dump badging "$APK" | grep -F "package: name='com.oea.launcher'"
          if "$AAPT2" dump badging "$APK" | grep -Fq "com.android.launcher3"; then
            echo "ERROR: Launcher3 identity remains in the APK."
            exit 1
          fi
          APKSIGNER="$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$RUNNER_TEMP/OEA-latest.apk"
      - name: Verify the games are inside the APK
        run: |
          set -euo pipefail
          APK="$(find oea/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT2="$BUILD_TOOLS/aapt2"
          # Each game keeps its own identity inside the one APK:
          # its own launcher activity, icon and label.
          for activity in \
            "com.oea.launcher.games.OeaEndlessDaysActivity" \
            "com.oea.launcher.games.OeaSendOffActivity" \
            "com.oea.launcher.games.OeaChessGameActivity"; do
            "$AAPT2" dump badging "$APK" | grep -F "name='$activity'"
          done
          for label in "Endless Days" "Send Off" "Chess"; do
            "$AAPT2" dump badging "$APK" | grep -F "label='$label'"
          done
      - name: Report APK sizes
        run: |
          set -euo pipefail
          # Sizes come from the zip central directory, so they are what the APK
          # costs on the wire rather than the uncompressed entry sizes.
          TABLE="| App | Size | Native libs | Code | Resources | Assets | Other |"$'\n'"| --- | --- | --- | --- | --- | --- | --- |"
          DETAILS=""
          TOTAL_KB=0
          for apk in oea/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            KB=$(du -k "$apk" | cut -f1)
            TOTAL_KB=$((TOTAL_KB + KB))
            read -r LIB DEX RES ASS OTH < <(unzip -v "$apk" | awk '
              $1 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+%$/ {
                c = $3; n = $8
                if (n ~ /^lib\//) lib += c
                else if (n ~ /^classes/ || n ~ /\.dex$/) dex += c
                else if (n ~ /^res\//) res += c
                else if (n ~ /^assets\//) ass += c
                else oth += c }
              END { printf "%d %d %d %d %d\n", lib, dex, res, ass, oth }')
            NAME=$(basename "$apk")
            if [ "$KB" -ge 1024 ]; then
              SIZE="$((KB / 1024)).$((KB % 1024 / 100)) MB"
            else
              SIZE="${KB} kB"
            fi
            TABLE="$TABLE"$'\n'"| $NAME | $SIZE | $((LIB / 1024))k | $((DEX / 1024))k | $((RES / 1024))k | $((ASS / 1024))k | $((OTH / 1024))k |"
            TOP=$(unzip -v "$apk" | awk '
              $1 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+%$/ { printf "%9d  %s\n", $3, $8 }' | sort -k1 -n -r | head -12)
            DETAILS="$DETAILS"$'\n'"<details><summary>$NAME - largest entries</summary>"$'\n\n'"\`\`\`"$'\n'"$TOP"$'\n'"\`\`\`"$'\n'"</details>"$'\n'
          done
          {
            echo "### APK sizes"
            echo ""
            echo "$TABLE"
            echo ""
            echo "Total across all apps: $((TOTAL_KB / 1024)) MB"
            echo ""
            echo "$DETAILS"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "$TABLE"
            echo ""
            echo "Total across all apps: $((TOTAL_KB / 1024)) MB"
            echo ""
            echo "$DETAILS"
          } > "$RUNNER_TEMP/sizes.md"
      - name: Comment APK sizes on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "### APK sizes from this build"
            echo ""
            cat "$RUNNER_TEMP/sizes.md"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md" || true
      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: oea-launcher-apk
          path: oea/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One APK: the launcher with Endless Days, Send Off and
          # Chess inside it, each with its own icon and identity.
          ASSETS=("$RUNNER_TEMP/OEA-latest.apk")
          if gh release view oea-latest >/dev/null 2>&1; then
            # --clobber replaces the old asset. This job is serialized above to
            # prevent another push from deleting the asset during this upload.
            gh release upload oea-latest "${ASSETS[@]}" --clobber
          else
            gh release create oea-latest "${ASSETS[@]}" --title "OEA Latest" \
              --notes "Latest OEA build from main. The single APK is the launcher with Endless Days, Send Off and Chess inside it, each keeping its own icon, label and identity."
          fi

  build-laptop-apk:
    # The laptop artifact is a release APK plus OEA-laptop-windows.zip.
    # OEA as a launcher on a laptop means Android running on the laptop (see
    # docs/oea-on-a-laptop.md). That environment is normally x86_64, while the
    # phone APK carries only arm64/armv7 native libraries. This job builds and
    # verifies the x86_64 APK on every PR, so a laptop build cannot regress
    # silently behind a green phone build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OEA
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # No shared Gradle cache here: this job runs beside the phone job, and
          # a cache restored while the other job is writing it can fail the
          # build before Gradle even configures. The laptop build is short
          # enough to resolve its own dependencies.
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Check the laptop scripts
        run: |
          set -euo pipefail
          for script in tools/laptop/*.sh; do bash -n "$script"; done
      - name: Use the stable OEA signing key (optional)
        # Same reasoning as the phone job: a stable debug key lets a new laptop
        # APK update the installed OEA in place instead of forcing an uninstall
        # that wipes the Home layout.
        env:
          OEA_DEBUG_KEYSTORE_BASE64: ${{ secrets.OEA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${OEA_DEBUG_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$OEA_DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "::notice::Signing with the stable OEA key from OEA_DEBUG_KEYSTORE_BASE64."
          else
            echo "::warning::OEA_DEBUG_KEYSTORE_BASE64 is not set: this APK is signed with a new random key and cannot update a previously installed OEA in place."
          fi
      - name: Build the x86_64 laptop APK
        # Release, not debug: minified and resource-shrunk exactly like the
        # phone build, so the laptop download is a finished install rather than
        # a debuggable development artifact.
        run: |
          set -o pipefail
          if ! ./gradlew :oea:assembleRelease -PextraAbi=x86_64 --stacktrace 2>&1 | tee "$RUNNER_TEMP/laptop-build.log"; then
            # Annotations are the only part of a failed job this repository can
            # read back through the API, so name the cause instead of hiding it
            # in a log attachment.
            { grep -E '^(e: |FAILURE:|\* What went wrong:|Could not |Caused by: )' "$RUNNER_TEMP/laptop-build.log" || true; } \
              | head -30 | while IFS= read -r line; do
                  printf '::error::%s\n' "${line//%/%25}"
                done
            exit 1
          fi
      - name: Verify the laptop APK
        run: |
          set -euo pipefail
          APK="$(find oea/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          # The WebRTC native library is the reason the default APK cannot
          # install on x86_64. If it is missing here, the APK is not a laptop
          # build and must not be published.
          unzip -l "$APK" | grep -Eq 'lib/x86_64/.*\.so$'
          # This must be the finished release build: correct identity, signed,
          # and not debuggable. A debug APK accidentally published here would
          # pass every other check.
          AAPT2="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.oea.launcher'"
          if echo "$BADGING" | grep -Fq "application-debuggable"; then
            echo "ERROR: the laptop APK is debuggable; publish a release build." >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$APK"
          cp "$APK" "$RUNNER_TEMP/OEA-laptop-x86_64.apk"
          ls -l "$RUNNER_TEMP/OEA-laptop-x86_64.apk"
      - name: Upload laptop APK
        uses: actions/upload-artifact@v4
        with:
          name: oea-laptop-apk
          path: ${{ runner.temp }}/OEA-laptop-x86_64.apk
          retention-days: 7
          if-no-files-found: error
      - name: Package the Windows setup
        # One archive a Windows user can extract and double-click: the release
        # APK, the setup scripts and the guide.
        run: ./tools/laptop/package-windows.sh "$RUNNER_TEMP/OEA-laptop-x86_64.apk" "$RUNNER_TEMP/OEA-laptop-windows.zip"
      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: oea-laptop-windows
          path: ${{ runner.temp }}/OEA-laptop-windows.zip
          retention-days: 7
          if-no-files-found: error
      - name: Publish the laptop APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=("$RUNNER_TEMP/OEA-laptop-x86_64.apk" "$RUNNER_TEMP/OEA-laptop-windows.zip")
          if gh release view oea-laptop-latest >/dev/null 2>&1; then
            gh release upload oea-laptop-latest "${ASSETS[@]}" --clobber
          else
            gh release create oea-laptop-latest "${ASSETS[@]}" \
              --title "OEA for laptop Android" \
              --notes "OEA, the Android launcher, as a release build (minified and resource-shrunk like the phone APK) with x86_64 native libraries. Install it in Waydroid, Android-x86 or an x86_64 emulator and set OEA as Home; its Home screen, drawer, arcade and games then run with the mouse and keyboard. On Windows, extract OEA-laptop-windows.zip and double-click OEA-Laptop-Setup.cmd. Guide: docs/oea-on-a-laptop.md."
          fi
