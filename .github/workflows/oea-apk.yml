      - name: Verify the battery work
        run: |
          set -euo pipefail
          MATH=oea/src/main/java/com/oea/launcher/power/OeaBatteryMath.kt
          STATE=oea/src/main/java/com/oea/launcher/power/OeaBatteryState.kt
          TEST=oea/src/test/java/com/oea/launcher/power/OeaBatteryMathTest.kt
          BOOST=oea/src/main/java/com/oea/launcher/gameboost/OeaGameBoostActivity.kt
          STRIP=oea/src/main/java/com/oea/launcher/gameboost/OeaGameBoostService.kt
