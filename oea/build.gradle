plugins {
    alias(libs.plugins.android.application)
}
android {
    namespace "com.oea.launcher"

    compileSdk 36
    defaultConfig {
        applicationId "com.oea.launcher"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "0.4.0-alpha8"
        // WebRTC ships native code; every current phone is covered by these two ABIs.
        ndk { abiFilters.addAll(["arm64-v8a", "armeabi-v7a"]) }
    }
    buildTypes {
        release {
            // R8 removes the code and resources nothing reaches any more, and
            // the rules in proguard-rules.pro keep every name OEA reports or
            // stores intact. This is the single largest APK win after the
            // wallpapers; see docs/apk-size-and-game-independence-2026-10-17.md.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        // Native libraries are compressed in the APK instead of being stored
        // page-aligned. Android extracts them on install, so the download is
        // much smaller (WebRTC is by far the biggest thing OEA ships).
        jniLibs { useLegacyPackaging = true }
        resources {
            // Kotlin metadata, tooling files and duplicate licences are dead
            // weight in a shipped APK.
            excludes += [
                "/META-INF/{AL2.0,LGPL2.1}",
                "/META-INF/*.kotlin_module",
                "/META-INF/*.version",
                "/META-INF/DEPENDENCIES",
                "/META-INF/NOTICE",
                "/META-INF/NOTICE.txt",
                "/META-INF/LICENSE",
                "/META-INF/LICENSE.txt",
                "/META-INF/services/javax.annotation.processing.Processor",
                "DebugProbesKt.bin",
                "kotlin-tooling-metadata.json",
            ]
        }
    }
    // Pure-logic unit tests (wave detector, theme catalogue) never call real
    // Android code; framework stubs return defaults instead of throwing.
    testOptions { unitTests.returnDefaultValues = true }
}
kotlin { jvmToolchain(21) }

dependencies {
    implementation project(":oea-engine")
    implementation project(":oea-games")
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.coroutines.android

    // EMAGE and VIP show your whole library, not a page of it, so their grids are
    // virtualised (recyclerview) and a picture's details are read from the file
    // itself (exifinterface) instead of being described as a placeholder.
    implementation libs.androidx.recyclerview
    implementation libs.androidx.exifinterface

    // The stability rules (fault policy), the theme catalogue, the wave detector
    // and the bundled-wallpaper model are pure Kotlin, so they are covered by
    // fast JVM tests rather than a device.
    testImplementation libs.junit
}
