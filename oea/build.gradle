plugins {
    alias(libs.plugins.android.application)
}
android {
    namespace "com.oea.launcher"

    compileSdk 36
    defaultConfig {
        applicationId "com.oea.launcher"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "0.3.0-alpha6"
        // WebRTC ships native code; every current phone is covered by these two ABIs.
        ndk { abiFilters.addAll(["arm64-v8a", "armeabi-v7a"]) }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
kotlin { jvmToolchain(21) }

dependencies {
    implementation project(":oea-engine")
    implementation project(":oea-games")
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.coroutines.android

    // The stability rules (fault policy) and the bundled-wallpaper model are
    // pure Kotlin, so they are covered by fast JVM tests rather than a device.
    testImplementation libs.junit
}
