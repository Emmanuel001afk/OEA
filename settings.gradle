pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // kadb's SPAKE2 implementation is published on JitPack.
        maven { url = uri("https://jitpack.io") }
    }
}
rootProject.name = "OEA"
include(":oea")
// OEA Game Engine (reusable runtime) and the first-party games built on it.
// The games ship inside the launcher APK: each keeps its own identity
// (icon, label, task, front menu, multiplayer) through the entries in
// com.oea.launcher.games.OeaGameEntries, so OEA builds exactly one APK.
include(":oea-engine")
include(":oea-games")
